<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark2: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.9);
            --glass: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            animation: titleGlow 2s infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 0 4px 20px rgba(99, 102, 241, 0.3); }
            100% { text-shadow: 0 4px 40px rgba(99, 102, 241, 0.6); }
        }
        
        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
            position: relative;
            display: inline-block;
        }
        
        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 2px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--glass);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        
        .name-display {
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }
        
        .name-display::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }
        
        #nameDisplay {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }
        
        #multiDisplay {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            z-index: 1;
        }
        
        .multi-name {
            padding: 10px 25px;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
            border: 2px solid rgba(99,102,241,0.4);
            border-radius: 15px;
            animation: popIn 0.5s ease;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        #nameDisplay.rolling {
            animation: roll 0.1s infinite alternate, pulse 2s infinite ease-in-out;
        }
        
        @keyframes roll {
            0% { transform: translateY(0) rotate(-0.5deg); }
            100% { transform: translateY(-5px) rotate(0.5deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        
        #nameDisplay.winner {
            animation: winAnim 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards, 
                      winnerGlow 2s infinite alternate;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            -webkit-background-clip: text;
        }
        
        @keyframes winAnim {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(8deg); }
            75% { transform: scale(0.85) rotate(-5deg); }
            90% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        
        @keyframes winnerGlow {
            0% { text-shadow: 0 0 20px rgba(244, 114, 182, 0.5); }
            100% { text-shadow: 0 0 40px rgba(244, 114, 182, 0.8); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 50%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        
        .btn:hover::before {
            transform: translateX(100%);
        }
        
        .btn.rolling {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            animation: pulseBtn 0.5s infinite alternate;
        }
        
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--muted);
        }
        
        .history-section, .winners-section {
            margin-top: 20px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }
        
        .history-list, .winners-grid {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .history-list::-webkit-scrollbar,
        .winners-grid::-webkit-scrollbar {
            width: 4px;
        }
        
        .history-list::-webkit-scrollbar-thumb,
        .winners-grid::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .history-index {
            font-weight: 700;
            color: var(--primary);
            min-width: 40px;
        }
        
        .history-name {
            flex: 1;
        }
        
        .history-time {
            color: var(--muted);
            font-size: 0.85rem;
        }
        
        .winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        
        .winner-chip {
            padding: 8px 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .winner-chip:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }
        
        .winner-count {
            color: var(--primary);
            font-size: 0.9rem;
        }
        
        .admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.active {
            display: flex;
            opacity: 1;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            border: 1px solid var(--glass);
            position: relative;
        }
        
        .modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: var(--danger);
            transform: rotate(90deg);
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        
        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #6366f1, #f472b6, #10b981, #f59e0b);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--secondary);
            color: white;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            animation: slideInRight 0.3s ease;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9998;
            animation: flash 0.3s ease;
            pointer-events: none;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        .empty-message {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 3px;
            transition: width 1s linear;
        }
        
        .progress-bar.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ 2024级6班智能点名系统</h1>
            <p class="subtitle">随机点名 · 公平公正 · 智能管理</p>
        </header>
        
        <div class="main-content">
            <div class="card name-display">
                <button class="admin-btn" onclick="showLogin()">
                    <span>🔐</span> 管理面板
                </button>
                
                <div id="nameDisplay">准备点名...</div>
                
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="controls">
                    <div style="display: flex; align-items: center; gap: 10px; margin-right: 15px;">
                        <span style="color: var(--muted);">抽</span>
                        <select id="pickCount" style="background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.3); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 1rem;">
                            <option value="1">1人</option>
                            <option value="2">2人</option>
                            <option value="3">3人</option>
                            <option value="4">4人</option>
                            <option value="5">5人</option>
                            <option value="6">6人</option>
                        </select>
                    </div>
                    <button class="btn" onclick="handleRoll()" id="startBtn">
                        <span>🎲</span> 开始点名
                    </button>
                    <button class="btn" onclick="toggleVoice()" id="voiceBtn">
                        <span>🔊</span> 朗读
                    </button>
                    <button class="btn" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="startGroupRoll()" id="groupBtn">
                        <span>👥</span> 小组抽签
                    </button>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总人数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="remainingCount">0</div>
                        <div class="stat-label">待点名</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="calledCount">0</div>
                        <div class="stat-label">已点名</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="section-title">
                    <span>📜</span> 最近点名
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-message">暂无记录</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="section-title">
                <span>🏆</span> 中奖榜
            </div>
            <div class="winners-grid" id="winnersGrid">
                <div class="empty-message">暂无记录</div>
            </div>
        </div>
    </div>
    
    <!-- 登录模态框 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="close-btn" onclick="hideModal('loginModal')">×</button>
            <h2 class="modal-title">🔐 管理员登录</h2>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-input" id="loginUser" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" id="loginPass" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="login()">登录</button>
            <div class="error-message" id="loginError">用户名或密码错误！</div>
        </div>
    </div>
    
    <!-- 管理面板模态框 -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="hideModal('adminModal')">×</button>
            <h2 class="modal-title">⚙️ 系统管理</h2>
            <div class="form-group">
                <label>学生名单 (每行一个名字)</label>
                <textarea class="form-input" id="studentNames" rows="10" placeholder="请输入学生名单，每行一个名字"></textarea>
            </div>
            <div class="form-group">
                <label>点名时间 (秒)</label>
                <input type="number" class="form-input" id="rollTime" min="1" max="10" value="2">
            </div>
            <div class="form-group">
                <label>背景图片 URL</label>
                <input type="text" class="form-input" id="bgImage" placeholder="输入背景图片链接">
            </div>
            <div class="form-group">
                <label>背景图标 URL</label>
                <input type="text" class="form-input" id="bgIcon" placeholder="输入图标链接">
            </div>
            
            <div class="form-group">
                <label>📋 小组设置 (格式: 组名-成员1,成员2,成员3 每行一组)</label>
                <textarea class="form-input" id="groupNames" rows="6" placeholder="示例:
第1组-张三,李四,王五
第2组-赵六,孙七,周八
第3组-吴九,郑十"></textarea>
            </div>
            
            <button class="btn" style="width: 100%;" onclick="saveSettings()">保存设置</button>
        </div>
    </div>
    
    <script>
        // 数据初始化
        const DEFAULT_STUDENTS = [
            "田好", "高可人", "郭怡辰", "周艺霏", "杨皓程", 
            "国诗杭", "任可盈", "孙百尘", "吕航", "卜一轩", 
            "孙琬淇", "梁朗宁", "吕明颢", "夏梓航", "刘祎琛", 
            "朱楷格", "柳佳乘", "马子涵", "李天歌", "冯喜研", 
            "陈思源", "马腾跃", "孟梓铎", "张楷奇", "那云昊", 
            "周梓琪", "于雯竹", "张雨航", "李雨诺", "于嘉诺", 
            "周禹潼", "李孟哲", "毕士轩", "于欣逸", "李妲", 
            "王禹博", "牛义开", "张一恒", "翟若寻", "张月胧", "梁舜"
        ];
        
        // 使用base64编码的密码
        const USERS = {
            "han": btoa("140729"),
            "vobl": btoa("320609")
        };
        
        let students = [];
        let callHistory = [];
        let callCounts = {};
        let isRolling = false;
        let rollInterval = null;
        let settings = {};
        let voiceEnabled = true;
        
        // 初始化
        function init() {
            loadData();
            renderStudents();
            renderHistory();
            renderWinners();
            updateStats();
        }
        
        // 加载数据
        function loadData() {
            // 加载设置
            const savedSettings = localStorage.getItem('rollCall_settings');
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
            } else {
                settings = {
                    rollTime: 2,
                    bgImage: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80',
                    bgIcon: 'https://th.bing.com/th/id/R.a258eaa11ca377122dffb04219e865bc?rik=jthsaEmnmEK02w&riu=http%3a%2f%2fwww.hmjfls.com%2fskins%2fcn%2fimages%2flogo2.png&ehk=o2e4ZH%2f8YcnNaoy5gc645OSO8rIQWoBM%2bIWTtcUds44%3d&risl=&pid=ImgRaw&r=0'
                };
            }
            
            // 加载学生名单
            const savedStudents = localStorage.getItem('rollCall_students');
            if (savedStudents) {
                students = JSON.parse(savedStudents);
            } else {
                students = [...DEFAULT_STUDENTS];
            }
            
            // 加载历史记录
            const savedHistory = localStorage.getItem('rollCall_history');
            if (savedHistory) {
                callHistory = JSON.parse(savedHistory);
            }
            
            // 加载点名次数
            const savedCounts = localStorage.getItem('rollCall_counts');
            if (savedCounts) {
                callCounts = JSON.parse(savedCounts);
            }
            
            // 应用背景
            document.body.style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url("${settings.bgImage}")`;
            
            // 更新设置表单
            document.getElementById('studentNames').value = students.join('\n');
            document.getElementById('rollTime').value = settings.rollTime;
            document.getElementById('bgImage').value = settings.bgImage;
            document.getElementById('bgIcon').value = settings.bgIcon;
            
            // 加载小组设置
            const savedGroups = localStorage.getItem('rollCall_groups');
            if (savedGroups) {
                groupSettings = JSON.parse(savedGroups);
            }
            
            // 显示小组设置
            if (Object.keys(groupSettings).length > 0) {
                const groupText = Object.entries(groupSettings)
                    .map(([group, members]) => `${group}-${members.join(',')}`)
                    .join('\n');
                document.getElementById('groupNames').value = groupText;
            }
        }
        
        // 保存数据
        function saveData() {
            localStorage.setItem('rollCall_students', JSON.stringify(students));
            localStorage.setItem('rollCall_history', JSON.stringify(callHistory));
            localStorage.setItem('rollCall_counts', JSON.stringify(callCounts));
            localStorage.setItem('rollCall_settings', JSON.stringify(settings));
        }
        
        // 开始点名
        function handleRoll() {
            const pickCount = parseInt(document.getElementById('pickCount').value);
            if (pickCount > 1) {
                startMultiRoll();
            } else {
                startRolling();
            }
        }
        
        function startRolling() {
            if (isRolling) {
                stopRolling();
                return;
            }
            
            if (students.length === 0) {
                showToast('请先添加学生名单！', 'warning');
                return;
            }
            
            isRolling = true;
            document.getElementById('startBtn').classList.add('rolling');
            document.getElementById('startBtn').innerHTML = '<span>⏹️</span> 停止';
            document.getElementById('nameDisplay').classList.add('rolling');
            document.getElementById('nameDisplay').classList.remove('winner');
            
            // 显示进度条
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.classList.add('active');
            progressFill.style.transition = `width ${settings.rollTime}s linear`;
            progressFill.style.width = '100%';
            
            // 开始随机滚动
            rollInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * students.length);
                document.getElementById('nameDisplay').textContent = students[randomIndex];
            }, 50);
            
            // 设置自动停止
            setTimeout(() => {
                stopRolling();
            }, settings.rollTime * 1000);
        }
        
        // 停止点名
        function stopRolling() {
            if (!isRolling) return;
            
            clearInterval(rollInterval);
            isRolling = false;
            
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.classList.remove('active');
            progressFill.style.width = '0';
            
            // 选择最终结果
            const selectedIndex = Math.floor(Math.random() * students.length);
            const selectedStudent = students[selectedIndex];
            
            document.getElementById('nameDisplay').textContent = selectedStudent;
            document.getElementById('nameDisplay').classList.remove('rolling');
            document.getElementById('nameDisplay').classList.add('winner');
            
            document.getElementById('startBtn').classList.remove('rolling');
            document.getElementById('startBtn').innerHTML = '<span>🎲</span> 开始点名';
            
            // 记录历史
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            callHistory.unshift({
                name: selectedStudent,
                time: timeString
            });
            
            if (callHistory.length > 20) {
                callHistory.pop();
            }
            
            // 更新计数
            callCounts[selectedStudent] = (callCounts[selectedStudent] || 0) + 1;
            
            // 保存数据
            saveData();
            
            // 更新界面
            updateStats();
            renderHistory();
            renderWinners();
            
            // 效果
            createConfetti();
            createFlash();
            playSuccessSound();
            
            // 语音朗读
            if (voiceEnabled) {
                speakName(selectedStudent);
            }
            
            showToast(`🎉 ${selectedStudent} 被点中！`, 'success');
        }
        
        // 语音朗读
        function speakName(name) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(name);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }
        
        // 多人抽签
        let multiRolling = false;
        let multiInterval = null;
        
        function startMultiRoll() {
            if (isRolling || multiRolling) {
                stopMultiRoll();
                return;
            }
            
            const pickCount = parseInt(document.getElementById('pickCount').value);
            
            if (students.length === 0) {
                showToast('请先添加学生名单！', 'warning');
                return;
            }
            
            if (pickCount > students.length) {
                showToast('抽取人数不能超过总人数！', 'warning');
                return;
            }
            
            multiRolling = true;
            document.getElementById('startBtn').classList.add('rolling');
            document.getElementById('startBtn').innerHTML = '<span>⏹️</span> 停止';
            
            // 滚动显示
            const display = document.getElementById('nameDisplay');
            display.innerHTML = '<span style="color: var(--muted);">准备中...</span>';
            
            multiInterval = setInterval(() => {
                const shuffled = [...students].sort(() => Math.random() - 0.5).slice(0, pickCount);
                display.innerHTML = shuffled.map(name => `<span class="multi-name">${name}</span>`).join('');
            }, 80);
            
            // 3秒后停止
            setTimeout(() => {
                stopMultiRoll();
            }, 3000);
        }
        
        function stopMultiRoll() {
            if (!multiRolling) return;
            
            clearInterval(multiInterval);
            multiRolling = false;
            
            const pickCount = parseInt(document.getElementById('pickCount').value);
            
            // 选择多个结果
            const shuffled = [...students].sort(() => Math.random() - 0.5);
            const winners = shuffled.slice(0, pickCount);
            
            // 显示结果
            const display = document.getElementById('nameDisplay');
            display.classList.remove('rolling');
            display.innerHTML = winners.map(name => `<span class="multi-name">${name}</span>`).join('');
            
            document.getElementById('startBtn').classList.remove('rolling');
            document.getElementById('startBtn').innerHTML = '<span>🎲</span> 开始点名';
            
            // 记录历史
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            winners.forEach(name => {
                callHistory.unshift({ name, time: timeString });
                callCounts[name] = (callCounts[name] || 0) + 1;
            });
            
            if (callHistory.length > 20) {
                callHistory = callHistory.slice(0, 20);
            }
            
            saveData();
            updateStats();
            renderHistory();
            renderWinners();
            
            createConfetti();
            playSuccessSound();
            
            // 朗读所有名字
            if (voiceEnabled) {
                winners.forEach((name, i) => {
                    setTimeout(() => speakName(name), i * 1500);
                });
            }
            
            showToast(`🎉 ${winners.join('、')} 被抽中！`, 'success');
        }
        
        // 小组抽签
        let groupRolling = false;
        let groupInterval = null;
        
        function startGroupRoll() {
            if (isRolling || multiRolling || groupRolling) {
                stopGroupRoll();
                return;
            }
            
            if (Object.keys(groupSettings).length === 0) {
                showToast('请先在管理面板设置小组！', 'warning');
                return;
            }
            
            groupRolling = true;
            document.getElementById('groupBtn').innerHTML = '<span>⏹️</span> 停止';
            
            const groupNames = Object.keys(groupSettings);
            const display = document.getElementById('nameDisplay');
            
            groupInterval = setInterval(() => {
                const randomGroup = groupNames[Math.floor(Math.random() * groupNames.length)];
                const members = groupSettings[randomGroup];
                const randomMember = members[Math.floor(Math.random() * members.length)];
                display.innerHTML = `<div style="text-align: center;"><div style="font-size: 1.5rem; color: var(--muted); margin-bottom: 10px;">第 ${randomGroup} 组</div><span class="multi-name">${randomMember}</span></div>`;
            }, 100);
            
            // 4秒后停止
            setTimeout(() => {
                stopGroupRoll();
            }, 4000);
        }
        
        function stopGroupRoll() {
            if (!groupRolling) return;
            
            clearInterval(groupInterval);
            groupRolling = false;
            
            document.getElementById('groupBtn').innerHTML = '<span>👥</span> 小组抽签';
            
            // 选择最终小组
            const groupNames = Object.keys(groupSettings);
            const winnerGroup = groupNames[Math.floor(Math.random() * groupNames.length)];
            const members = groupSettings[winnerGroup];
            const winner = members[Math.floor(Math.random() * members.length)];
            
            const display = document.getElementById('nameDisplay');
            display.innerHTML = `<div style="text-align: center;"><div style="font-size: 2rem; background: linear-gradient(135deg, #f472b6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px;">🎉 第 ${winnerGroup} 组 🎉</div><div style="font-size: 3rem; font-weight: 900; color: #fff;">${winner}</div><div style="font-size: 1rem; color: var(--muted); margin-top: 10px;">小组成员: ${members.join('、')}</div></div>`;
            
            createConfetti();
            playSuccessSound();
            
            if (voiceEnabled) {
                setTimeout(() => speakName(`第${winnerGroup}组，${winner}`), 500);
            }
            
            showToast(`🎉 第 ${winnerGroup} 组 ${winner} 被抽中！`, 'success');
        }
        
        // 切换语音
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.innerHTML = voiceEnabled ? '<span>🔊</span> 朗读' : '<span>🔇</span> 静音';
            showToast(voiceEnabled ? '语音朗读已开启' : '语音朗读已关闭');
        }
        
        // 彩纸效果
        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.top = '0';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 20);
            }
        }
        
        // 闪光效果
        function createFlash() {
            const flash = document.createElement('div');
            flash.className = 'flash';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.remove();
            }, 300);
        }
        
        // 成功音效
        function playSuccessSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(1100, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(1320, audioContext.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } catch (e) {
                // 音频上下文可能不支持
            }
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('totalCount').textContent = students.length;
            document.getElementById('remainingCount').textContent = students.length;
            document.getElementById('calledCount').textContent = Object.keys(callCounts).length;
        }
        
        // 渲染学生列表
        function renderStudents() {
            updateStats();
        }
        
        // 渲染历史记录
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            
            if (callHistory.length === 0) {
                historyList.innerHTML = '<div class="empty-message">暂无记录</div>';
                return;
            }
            
            historyList.innerHTML = callHistory.map((item, index) => `
                <div class="history-item">
                    <div class="history-index">#${index + 1}</div>
                    <div class="history-name">${item.name}</div>
                    <div class="history-time">${item.time}</div>
                </div>
            `).join('');
        }
        
        // 渲染获奖者
        function renderWinners() {
            const winnersGrid = document.getElementById('winnersGrid');
            
            const sortedWinners = Object.entries(callCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 12);
            
            if (sortedWinners.length === 0) {
                winnersGrid.innerHTML = '<div class="empty-message">暂无记录</div>';
                return;
            }
            
            winnersGrid.innerHTML = sortedWinners.map(([name, count]) => `
                <div class="winner-chip">
                    <div>${name}</div>
                    <div class="winner-count">${count}次</div>
                </div>
            `).join('');
        }
        
        // 显示登录模态框
        function showLogin() {
            document.getElementById('loginModal').classList.add('active');
        }
        
        // 隐藏模态框
        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        // 登录
        function login() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;
            
            if (!username || !password) {
                showError('请输入用户名和密码！');
                return;
            }
            
            // 检查用户
            if (!USERS[username] || btoa(password) !== USERS[username]) {
                showError('用户名或密码错误！');
                return;
            }
            
            // 登录成功
            hideModal('loginModal');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
            
            showAdminPanel();
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // 显示管理面板
        function showAdminPanel() {
            document.getElementById('adminModal').classList.add('active');
        }
        
        // 保存设置
        function saveSettings() {
            const studentNames = document.getElementById('studentNames').value
                .split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);
            
            if (studentNames.length === 0) {
                showToast('请至少添加一个学生！', 'warning');
                return;
            }
            
            students = studentNames;
            settings.rollTime = parseInt(document.getElementById('rollTime').value) || 2;
            settings.bgImage = document.getElementById('bgImage').value.trim() || settings.bgImage;
            settings.bgIcon = document.getElementById('bgIcon').value.trim() || settings.bgIcon;
            
            // 解析小组设置
            const groupText = document.getElementById('groupNames').value.trim();
            if (groupText) {
                const lines = groupText.split('\n').filter(line => line.trim());
                groupSettings = {};
                lines.forEach(line => {
                    const [groupName, membersStr] = line.split('-');
                    if (groupName && membersStr) {
                        const members = membersStr.split(',').map(m => m.trim()).filter(m => m);
                        groupSettings[groupName.trim()] = members;
                    }
                });
                localStorage.setItem('rollCall_groups', JSON.stringify(groupSettings));
            } else {
                groupSettings = {};
                localStorage.removeItem('rollCall_groups');
            }
            
            // 应用新背景
            document.body.style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url("${settings.bgImage}")`;
            
            // 清空历史记录
            callHistory = [];
            callCounts = {};
            
            saveData();
            updateStats();
            renderHistory();
            renderWinners();
            
            hideModal('adminModal');
            showToast('设置保存成功！', 'success');
        }
        
        // 显示提示
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            
            if (type === 'error') {
                toast.style.background = '#ef4444';
            } else if (type === 'warning') {
                toast.style.background = '#f59e0b';
            } else if (type === 'success') {
                toast.style.background = '#10b981';
            }
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // 清空记录
        function clearHistory() {
            if (!confirm('确定要清空所有记录吗？')) return;
            
            callHistory = [];
            callCounts = {};
            
            saveData();
            renderHistory();
            renderWinners();
            
            showToast('记录已清空！', 'success');
        }
        
        // 页面加载完成
        window.addEventListener('load', init);
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                startRolling();
            } else if (e.code === 'Escape') {
                hideModal('loginModal');
                hideModal('adminModal');
            }
        });
    </script>
</body>
</html>
